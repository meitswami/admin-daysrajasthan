name: Deploy to VPS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-admin-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          # next build + tsc on the VPS often exceeds the 10m default
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            ADMIN_DIR=/var/www/daysrajasthan-admin
            cd "$ADMIN_DIR"
            git fetch --all --prune
            git reset --hard origin/master
            # Always run the script from the repo (keeps VPS /opt copy from going stale).
            # deploy-admin.sh wipes node_modules before npm ci to avoid ENOTEMPTY/rmdir.
            bash "$ADMIN_DIR/deploy/deploy-admin.sh" master
